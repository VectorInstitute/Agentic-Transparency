<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When retrieval becomes agentic</title>
<style>

*{box-sizing:border-box}
@font-face{font-family:Karbon;src:url("assets/fonts/Karbon-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:Karbon;src:url("assets/fonts/Karbon-MediumItalic.woff2") format("woff2");font-weight:500;font-style:italic;font-display:swap}
/* The header fills whatever it is put in. A fixed min-height meant that an
   embed of any other shape got the banner plus a band of empty ground beneath
   it, almost as tall as the banner itself, and the capture viewport is set
   explicitly anyway so the shipped rasters are unaffected. */
html,body{margin:0;padding:0;height:100%}
body{background:#0B0920}
.hdr{position:relative;isolation:isolate;overflow:hidden;
  width:100%;height:100%;min-height:620px;display:flex;align-items:flex-end;
  background:linear-gradient(135deg, #8A25C9, #03BFDC);
  font-family:Karbon,"Open Sans",Helvetica,Arial,sans-serif;}
@supports (height: 1cqh) { .hdr{min-height:0} }
.hdr--untitled .hdr__inner{display:none}
.hdr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hdr__ground{z-index:0}
.hdr__field{z-index:1}
.hdr__scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg, rgba(8,6,24,.34) 0%, rgba(8,6,24,0) 34%, rgba(8,6,24,0) 58%, rgba(8,6,24,.60) 100%)}
.hdr__inner{position:relative;z-index:3;width:min(1100px,calc(100% - 5rem));
  margin-inline:auto;padding-block:clamp(3rem,8vw,5rem);color:#fff;
  will-change:transform}
.hdr__eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.78);margin:0 0 1.2rem}
.hdr__title{font-size:clamp(2rem,1rem + 4.4vw,3.8rem);font-weight:500;
  letter-spacing:-.03em;line-height:1.02;margin:0;text-wrap:balance;
  text-shadow:0 2px 30px rgba(10,5,30,.35)}
/* Parallax is driven per frame by the smoother in header.js rather than by a CSS
   transition; a transition on top of that adds a second lag and reintroduces the
   snap it replaced. Under reduced motion the script never writes a transform. */

</style>
</head>
<body>
<header class="hdr" data-header data-artifact="header" data-artifact-reduce>
  <script>
  // The article page prints the h1 itself, so its embed loads this page with
  // #untitled and the banner carries no type of its own. Captures and direct
  // opens keep the headline.
  if (location.hash.indexOf("untitled") !== -1) document.currentScript.parentElement.className += " hdr--untitled";
  </script>
  <canvas class="hdr__ground" data-ground aria-hidden="true"></canvas>
  <canvas class="hdr__field" data-field aria-hidden="true"></canvas>
  <div class="hdr__scrim" aria-hidden="true"></div>
  <div class="hdr__inner" data-inner>

    <h1 class="hdr__title">When retrieval becomes agentic</h1>
  </div>
</header>
